<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MedSched</title>
  <meta name="description" content="AVH / LWF clinical coordination: port cath, admissions, follow-up, tumor board and clinic appointments.">
  <meta name="theme-color" content="#F4F7F7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MedSched">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="rail" aria-label="Main navigation">
      <div class="brand">
        <img src="icons/icon.svg" width="36" height="36" alt="">
        <div><strong translate="no">MedSched</strong><span>AVH / LWF Coordination</span></div>
      </div>
      <nav>
        <ul class="nav">
          <li><a href="#/today" data-route="today"><span class="ico" data-icon="home"></span><span class="label">Today</span><span class="count" data-count="today"></span></a></li>
          <li><a href="#/portcath" data-route="portcath"><span class="ico" data-icon="port"></span><span class="label">Port Cath</span><span class="count warn" data-count="portcath"></span></a></li>
          <li><a href="#/admissions" data-route="admissions"><span class="ico" data-icon="bed"></span><span class="label">Admissions</span><span class="count" data-count="admissions"></span></a></li>
          <li><a href="#/followup" data-route="followup"><span class="ico" data-icon="chat"></span><span class="label">WhatsApp &amp; Call</span><span class="count" data-count="followup"></span></a></li>
          <li><a href="#/tumorboard" data-route="tumorboard"><span class="ico" data-icon="board"></span><span class="label">Tumor Board</span><span class="count" data-count="tumorboard"></span></a></li>
          <li><a href="#/clinic" data-route="clinic"><span class="ico" data-icon="stethoscope"></span><span class="label">Clinic Appointments</span><span class="count" data-count="clinic"></span></a></li>
          <li><a href="#/calendar" data-route="calendar"><span class="ico" data-icon="calendar"></span><span class="label">Calendar</span></a></li>
          <li class="nav-sep" aria-hidden="true"></li>
          <li><a href="#/import" data-route="import"><span class="ico" data-icon="upload"></span><span class="label">Smart Import</span></a></li>
          <li><a href="#/settings" data-route="settings"><span class="ico" data-icon="settings"></span><span class="label">Settings</span></a></li>
        </ul>
      </nav>
      <div class="rail-foot">
        <button type="button" class="sync-pill" id="sync-pill" data-action="sync-now" aria-live="polite"><span class="dot"></span><span class="label">Connecting…</span></button>
        <div class="rail-meta"><span id="user-chip"></span><a href="backup/v1/index.html" class="old-link">Old version</a></div>
      </div>
    </aside>
    <div class="scrim-rail" data-action="toggle-rail"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn rail-toggle" data-action="toggle-rail" aria-label="Open menu"><span data-icon="menu"></span></button>
        <div class="title-wrap"><h1 id="page-title">Today</h1><p id="page-sub"></p></div>
        <div class="global-search" role="search">
          <span data-icon="search"></span>
          <input id="global-search" type="search" placeholder="Find a patient by name, file or phone…" autocomplete="off" spellcheck="false" aria-label="Find a patient" aria-controls="global-results">
          <kbd>Ctrl K</kbd>
          <div class="results" id="global-results" role="listbox" hidden></div>
        </div>
        <button type="button" class="icon-btn" data-action="toggle-theme" aria-label="Switch light or dark theme" id="theme-btn"></button>
      </header>
      <div class="banner" id="banner" role="status" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
